name = "af-procurement-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# ─── Custom domain ────────────────────────────────────────────────────────────
# procurement-api.isaudi.ai is registered as a Cloudflare Workers Custom Domain
# for this worker via the account-level Workers Domains API.
# The DNS CNAME is managed automatically by Cloudflare.
# Zone: isaudi.ai (ba5fe902a10311b7620231be05bf5668)
# Domain record ID: 43fdb9839c4b95abc4c744d3b5e79e0aca48b1e9
#
# To revert: DELETE /accounts/{accountId}/workers/domains/43fdb9839c4b95abc4c744d3b5e79e0aca48b1e9

# ─── Non-secret configuration ────────────────────────────────────────────────
[vars]
ALLOWED_ORIGINS = "https://admin.isaudi.ai,https://suppliers.isaudi.ai,https://procurement-api.isaudi.ai"
PUBLIC_BASE_URL = "https://suppliers.isaudi.ai"
# Cloudinary — public values (safe in [vars]; they are embedded in the supplier page HTML)
CLOUDINARY_CLOUD_NAME = "dd8crithl"
CLOUDINARY_UPLOAD_PRESET = "afal_uploads"

# ─── Secrets (do NOT put values here) ────────────────────────────────────────
# Set these via:  wrangler secret put <NAME>
#
#   wrangler secret put FIREBASE_PROJECT_ID
#   wrangler secret put FIREBASE_CLIENT_EMAIL
#   wrangler secret put FIREBASE_PRIVATE_KEY
